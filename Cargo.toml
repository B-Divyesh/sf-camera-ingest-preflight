[package]
name = "camera-ingest-preflight"
version = "0.1.0"
edition = "2024"
description = "Read-only preflight scanner for mixed-camera and 360 photo ingests"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-camera-ingest-preflight"
readme = "README.md"
keywords = ["photography", "exif", "ingest", "cli", "360"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "camera-ingest-preflight"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
